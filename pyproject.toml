[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-auto"
version = "0.1.0"
description = "Modular VMOS Edge automation for the Muse (Meta) Android app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "xlrd>=2.0.1",
  "xlwt>=1.3.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
muse-auto = "muse_auto.cli:main"
muse-auto-gui = "muse_auto.gui.__main__:main"

[tool.setuptools.packages.find]
include = ["muse_auto*"]

[tool.setuptools.package-data]
muse_auto = ["py.typed"]
